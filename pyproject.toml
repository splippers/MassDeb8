[project]
name = "massdeb8"
version = "0.1.0"
description = "LAN virtual debating arena for Ollama-backed LLM philosophers, refereed by Confucius."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
  "websockets>=12.0",
]

[tool.uv]
dev-dependencies = [
  "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
